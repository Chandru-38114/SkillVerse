<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Brand icon box -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="#FF8A3D" stroke="#29251F" stroke-width="6" />
  <!-- Inner S-mark (monochrome white with opacity layering) -->
  <g transform="translate(13, 13) scale(0.74)">
    <!-- Top stroke: white -->
    <path
      d="M74,30 C74,18 54,14 42,20 C32,25 32,36 44,40"
      stroke="#FFFFFF"
      stroke-width="13"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Top arrowhead: white -->
    <polygon points="66,26 78,10 82,26" fill="#FFFFFF" />
    <!-- Bottom stroke: white at 65% opacity -->
    <path
      d="M44,40 C56,44 68,48 68,60 C68,72 46,76 34,70"
      stroke="#FFFFFF"
      stroke-opacity="0.65"
      stroke-width="13"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Bottom arrowhead: white at 65% opacity -->
    <polygon points="42,76 22,90 28,68" fill="#FFFFFF" fill-opacity="0.65" />
    <!-- Center node: white with orange ring -->
    <circle cx="44" cy="40" r="8" fill="#FFFFFF" stroke="#FF8A3D" stroke-width="3" />
  </g>
</svg>